name: HeroStar CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prompt contract diagnostics
        shell: bash
        run: |
          files="$(grep -lE 'consultationSystemPrompt|consultation-profiles|promptVersion' test/*.test.js)"
          printf 'Prompt contract files:\n%s\n' "$files"
          node --test --test-reporter=spec $files
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Syntax check
        run: |
          node --check server.js
          for file in public/*.js public/clone/live/*.js; do node --check "$file"; done
          for file in src/*.js; do node --check "$file"; done
