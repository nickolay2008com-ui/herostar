name: HeroStar CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests with diagnostic report
        run: |
          set +e
          node --test --test-reporter=junit > test-results.xml
          status=$?
          echo "$status" > test-exit-code
          exit 0
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-results.xml
      - name: Enforce unit test result
        run: exit "$(cat test-exit-code)"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Syntax check
        run: |
          node --check server.js
          for file in public/*.js public/clone/live/*.js; do node --check "$file"; done
          for file in src/*.js; do node --check "$file"; done
