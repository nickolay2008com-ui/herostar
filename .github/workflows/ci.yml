name: HeroStar CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - run: node --test --test-reporter=spec test/clone-functional-wiring.test.js test/clone-mobile-quality.test.js test/clone-gears-contract.test.js