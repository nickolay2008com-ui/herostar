name: HeroStar CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: git clone -q --depth 1 --branch fix/telegram-auth-loader https://github.com/nickolay2008com-ui/herostar.git repo
      - working-directory: repo
        run: npm install --ignore-scripts --no-audit --no-fund >/dev/null
      - working-directory: repo
        run: |
          set +e
          npm test -- --test-reporter=spec > test-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -80 test-output.log
          fi
          exit "$status"