name: Apply clone priority one

on:
  push:
    branches:
      - feature/clone-priority-one

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: "!contains(github.event.head_commit.message, '[priority-one-applied]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clone-priority-one
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply canonical priority-one implementation
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/apply-priority-one.py
          python /tmp/apply-priority-one.py
      - name: Unit and contract tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Syntax and diff validation
        shell: bash
        run: |
          node --check server.js
          for file in public/*.js public/clone/live/*.js src/*.js; do node --check "$file"; done
          git diff --check
      - name: Publish verified implementation
        shell: bash
        run: |
          git config user.name "HeroStar Quality Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Реализовать первую очередь Клона [priority-one-applied]"
          git push origin HEAD:feature/clone-priority-one
