name: Apply clone birth form polish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Запустить точечную правку формы рождения'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply calm input focus and hide empty place results
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('public/clone/live/live.css')
          css = css_path.read_text(encoding='utf-8')

          marker_pattern = re.compile(
              r"(\.live-product :where\(button,a,input,textarea,summary\):focus-visible \{\n"
              r"\s*outline: 2px solid var\(--live-gold\);\n"
              r"\s*outline-offset: 3px;\n"
              r"\})"
          )

          override = r"""\1

/* Birth fields keep a clear but calm focus state; no browser-blue or competing gold frame. */
.live-product .birth-form input:focus,
.live-product .birth-form input:focus-visible {
  outline: 0;
  outline-offset: 0;
  border-color: rgba(167,139,250,.52);
  background: rgba(255,255,255,.055);
  box-shadow: 0 0 0 3px rgba(167,139,250,.075), inset 0 1px rgba(255,255,255,.035);
}

.live-product .birth-form input:-webkit-autofill,
.live-product .birth-form input:-webkit-autofill:hover,
.live-product .birth-form input:-webkit-autofill:focus {
  -webkit-text-fill-color: #f5f2f8;
  caret-color: #f5f2f8;
  border-color: rgba(167,139,250,.38);
  -webkit-box-shadow: 0 0 0 1000px #181a28 inset;
  box-shadow: 0 0 0 1000px #181a28 inset;
  transition: background-color 9999s ease-out 0s;
}

.live-product .birth-form input:-webkit-autofill:focus {
  border-color: rgba(167,139,250,.52);
  -webkit-box-shadow: 0 0 0 1000px #181a28 inset, 0 0 0 3px rgba(167,139,250,.075);
  box-shadow: 0 0 0 1000px #181a28 inset, 0 0 0 3px rgba(167,139,250,.075);
}

/* The closed combobox must not leave a decorative line under the city field. */
.live-product .place-results:empty {
  display: none;
}
"""

          if '.birth-form input:-webkit-autofill' in css:
              raise SystemExit('birth form polish already exists')
          css, changed = marker_pattern.subn(override, css, count=1)
          if changed != 1:
              raise SystemExit(f'focus marker replacements: {changed}')
          css_path.write_text(css, encoding='utf-8')

          html_path = Path('public/clone/live/index.html')
          html = html_path.read_text(encoding='utf-8')
          html, versioned = re.subn(
              r'/clone/live/live\.css\?v=[A-Za-z0-9._-]+',
              '/clone/live/live.css?v=20260727-birthfocus1',
              html,
              count=1,
          )
          if versioned != 1:
              raise SystemExit(f'live.css version replacements: {versioned}')
          html_path.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/apply-clone-birth-form-polish.yml')
          workflow.unlink()
          PY

      - name: Validate change
        shell: bash
        run: |
          grep -Fq '.live-product .birth-form input:focus-visible' public/clone/live/live.css
          grep -Fq '.live-product .birth-form input:-webkit-autofill' public/clone/live/live.css
          grep -Fq '.live-product .place-results:empty' public/clone/live/live.css
          grep -Fq '/clone/live/live.css?v=20260727-birthfocus1' public/clone/live/index.html
          git diff --check

      - name: Publish
        shell: bash
        run: |
          git config user.name "HeroStar Quality Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/clone/live/live.css public/clone/live/index.html .github/workflows/apply-clone-birth-form-polish.yml
          git commit -m "Смягчить выделение полей формы рождения"
          git push origin HEAD:main
