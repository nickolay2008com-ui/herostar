name: Apply clone production fixes

on:
  push:
    branches:
      - fix/clone-production-readiness

permissions:
  contents: write

jobs:
  apply-and-test:
    if: "!contains(github.event.head_commit.message, '[clone-fixes-applied]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clone-production-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply focused patch
        shell: bash
        env:
          PATCH_B64: "]"
        run: |
          python - <<'PY'
          import os, base64, gzip
          payload = gzip.decompress(base64.b64decode(os.environ['PATCH_B64']))
          open('/tmp/apply_clone_fixes.py', 'wb').write(payload)
          PY
          python /tmp/apply_clone_fixes.py
      - name: Install and test
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-clone-fixes.yml
          git add -A
          git commit -m "Закрыть три риска Звёздного клона [clone-fixes-applied]"
          git push origin HEAD:fix/clone-production-readiness
