name: Apply clone live metrics

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Подключить полную аналитику рекламной воронки'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Connect metrics bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/clone/live/index.html')
          html = path.read_text(encoding='utf-8')
          marker = '  <script src="/clone/live/live-stats.js?v=20260728-factors1" defer></script>\n'
          replacement = marker + '  <script src="/clone/live/live-metrics.js?v=20260728-funnel1" defer></script>\n'
          if html.count(marker) != 1:
              raise SystemExit(f'metrics marker count: {html.count(marker)}')
          html = html.replace(marker, replacement, 1)
          path.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/apply-clone-live-metrics.yml')
          workflow.unlink()
          PY

      - name: Validate
        shell: bash
        run: |
          test -f public/clone/live/live-metrics.js
          grep -Fq '/clone/live/live-metrics.js?v=20260728-funnel1' public/clone/live/index.html
          git diff --check

      - name: Publish
        shell: bash
        run: |
          git config user.name "HeroStar Quality Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/clone/live/index.html .github/workflows/apply-clone-live-metrics.yml
          git commit -m "Подключить аналитику рекламной воронки"
          git push origin HEAD:main
