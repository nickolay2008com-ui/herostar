name: Diagnose PR 134 e2e

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-pr-134-e2e.yml

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Диагностировать падение e2e PR 134'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: nickolay2008com-ui/herostar
    steps:
      - name: Extract failed browser-test log
        shell: bash
        run: |
          gh run view 30282476388 --job 90033574911 --log-failed > failed.log 2>&1 || true
          {
            echo '### Диагностика повторного e2e-падения'
            echo
            echo '```text'
            tail -n 320 failed.log
            echo '```'
          } > comment.md
          gh pr comment 134 --body-file comment.md
