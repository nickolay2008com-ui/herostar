name: HeroStar Production Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herostar-production-delivery
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4

      - name: Wait for Railway and verify Live bytes
        shell: bash
        env:
          PROD_BASE: https://herostar.up.railway.app
        run: |
          set -euo pipefail

          expected_file="public/clone/live/index.html"
          expected_hash="$(sha256sum "$expected_file" | awk '{print $1}')"
          echo "Expected Live SHA-256: $expected_hash"
          echo "Git commit: $GITHUB_SHA"

          for attempt in $(seq 1 40); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            health_ok=0
            live_ok=0
            actual_hash="unavailable"

            if curl --fail --silent --show-error --location --max-time 12 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${PROD_BASE}/health?delivery=${stamp}" \
              --output /tmp/herostar-health.json; then
              if grep -q '"ok":true' /tmp/herostar-health.json; then
                health_ok=1
              fi
            fi

            if curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${PROD_BASE}/clone/live/?delivery=${stamp}" \
              --output /tmp/herostar-live.html; then
              actual_hash="$(sha256sum /tmp/herostar-live.html | awk '{print $1}')"
              if [[ "$actual_hash" == "$expected_hash" ]]; then
                live_ok=1
              fi
            fi

            echo "attempt=${attempt} health=${health_ok} live=${live_ok} actual=${actual_hash}"

            if [[ "$health_ok" == "1" && "$live_ok" == "1" ]]; then
              echo "Production verified: Railway is healthy and /clone/live/ exactly matches this main commit."
              exit 0
            fi

            sleep 15
          done

          echo "Production did not converge to the current main commit within the verification window." >&2
          echo "Expected hash: $expected_hash" >&2
          if [[ -f /tmp/herostar-live.html ]]; then
            echo "Last actual hash: $(sha256sum /tmp/herostar-live.html | awk '{print $1}')" >&2
            diff -u "$expected_file" /tmp/herostar-live.html | head -n 120 || true
          fi
          exit 1

      - name: One-time production AI smoke test
        shell: bash
        env:
          PROD_BASE: https://herostar.up.railway.app
        run: |
          set -euo pipefail
          visitor="ci-ai-smoke-${GITHUB_SHA:0:12}"

          curl --fail --silent --show-error --location --max-time 45 \
            -X POST "${PROD_BASE}/api/charts" \
            -H 'Content-Type: application/json' \
            -H "x-visitor-id: ${visitor}" \
            --data '{"demo":true,"product":"clone"}' \
            --output /tmp/herostar-ai-chart.json

          read -r chart_id chart_token < <(python - <<'PY'
          import json
          with open('/tmp/herostar-ai-chart.json', encoding='utf-8') as f:
              data = json.load(f)
          chart_id = str(data.get('id') or '')
          token = str(data.get('accessToken') or '')
          if not chart_id or not token:
              raise SystemExit('Production chart creation did not return id/accessToken')
          print(chart_id, token)
          PY
          )

          http_code="$(curl --silent --show-error --location --max-time 110 \
            -X POST "${PROD_BASE}/api/consult" \
            -H 'Content-Type: application/json' \
            -H "x-chart-token: ${chart_token}" \
            -H "x-visitor-id: ${visitor}" \
            --data "$(python - "$chart_id" <<'PY'
          import json, sys
          print(json.dumps({
              'chartId': sys.argv[1],
              'product': 'clone',
              'question': 'Назови один практичный критерий выбора между двумя вариантами и объясни его одним предложением.'
          }, ensure_ascii=False))
          PY
          )" \
            --output /tmp/herostar-ai-consult.json \
            --write-out '%{http_code}')"

          python - "$http_code" <<'PY'
          import json, sys
          code = int(sys.argv[1])
          with open('/tmp/herostar-ai-consult.json', encoding='utf-8') as f:
              data = json.load(f)
          answer = str(data.get('answer') or '').strip()
          if code != 200:
              raise SystemExit(f'Production /api/consult returned HTTP {code}: {data.get("code") or data.get("error") or "unknown error"}')
          if len(answer) < 20:
              raise SystemExit('Production /api/consult returned no meaningful AI answer')
          print(f'AI_SMOKE_OK status={code} answer_chars={len(answer)} factors={len(data.get("factors") or [])}')
          PY
