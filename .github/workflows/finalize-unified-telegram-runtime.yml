name: Finalize unified Telegram runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/finalize-unified-telegram-runtime
          path: source
          fetch-depth: 1
          show-progress: false
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-telegram-runtime
          path: work
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: Apply final engineering review
        run: python source/scripts/finalize-unified-telegram-runtime.py work
      - name: Install dependencies
        working-directory: work
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Isolated Telegram flow
        working-directory: work
        run: node --test --test-reporter=spec test/telegram-update-runtime.test.js
      - name: Full unit and contract suite
        working-directory: work
        run: npm test
      - name: Syntax and diff validation
        working-directory: work
        shell: bash
        run: |
          node --check bootstrap.js
          node --check src/telegram-link-auth.js
          node --check src/practice-notifications.js
          node --check test/telegram-update-runtime.test.js
          git diff --check
          test "$(grep -R --exclude-dir=node_modules -l "'getUpdates'" src | wc -l)" -eq 1
      - name: Publish reviewed implementation
        working-directory: work
        shell: bash
        run: |
          git config user.name "HeroStar Quality Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bootstrap.js src/telegram-link-auth.js test/telegram-link-auth.test.js test/telegram-update-runtime.test.js
          git commit -m "Усилить единый Telegram runtime и сквозной тест"
          git push origin HEAD:refs/heads/agent/unified-telegram-runtime
