name: Production Telegram smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify deployed Telegram entry points
        run: |
          node <<'NODE'
          import assert from 'node:assert/strict';

          const base = 'https://herostar.up.railway.app';
          async function request(path, options = {}) {
            const response = await fetch(new URL(path, base), {
              redirect: 'manual',
              signal: AbortSignal.timeout(20_000),
              ...options,
            });
            const text = await response.text();
            let json = null;
            try { json = JSON.parse(text); } catch { json = null; }
            return { response, text, json };
          }

          const health = await request('/health');
          assert.equal(health.response.status, 200, `health: ${health.text}`);

          const config = await request('/api/config');
          assert.equal(config.response.status, 200, `config: ${config.text}`);
          assert.equal(config.json?.telegramConfigured, true, 'Railway должен видеть Telegram-бота');

          const live = await request('/clone/live/');
          assert.equal(live.response.status, 200, 'live clone page must open');
          const authClient = live.text.indexOf('/clone-living.js');
          const cloneClient = live.text.indexOf('/clone.js');
          assert.ok(authClient >= 0 && cloneClient > authClient, 'Telegram client must load before clone client');

          const created = await request('/api/auth/telegram-link', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
          });
          assert.equal(created.response.status, 201, `create link: ${created.text}`);
          assert.match(created.json?.token || '', /^[A-Za-z0-9_-]{24,80}$/);
          assert.match(created.json?.telegramUrl || '', /^https:\/\/t\.me\/[A-Za-z0-9_]+\?start=login_[A-Za-z0-9_-]{24,80}$/);

          const pending = await request('/api/auth/telegram-link/status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: created.json.token }),
          });
          assert.equal(pending.response.status, 200, `pending status: ${pending.text}`);
          assert.equal(pending.json?.status, 'pending');
          assert.equal(pending.response.headers.get('set-cookie'), null, 'pending link must not create a session');

          const invalidToken = await request('/api/auth/telegram-link/status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: 'bad' }),
          });
          assert.equal(invalidToken.response.status, 400);
          assert.equal(invalidToken.json?.code, 'INVALID_TELEGRAM_LINK');

          const invalidChart = await request('/api/auth/telegram-link', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chartId: 'not-a-uuid' }),
          });
          assert.equal(invalidChart.response.status, 400);
          assert.equal(invalidChart.json?.code, 'INVALID_CHART_ID');

          console.log(JSON.stringify({
            production: base,
            health: true,
            telegramConfigured: true,
            loginLinkCreated: true,
            persistedStatus: 'pending',
            validationGuards: true,
          }));
          NODE
