name: Debug tests

on:
  pull_request:

jobs:
  debug-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Capture test output
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          echo "$status" > test-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: debug-test-output
          path: |
            test-output.log
            test-exit-code.txt
          retention-days: 1
