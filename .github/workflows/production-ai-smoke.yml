name: HeroStar Production AI Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - '.github/workflows/production-ai-smoke.yml'
      - 'src/gemini-openai-bridge.js'

permissions:
  contents: read

concurrency:
  group: herostar-production-ai-smoke
  cancel-in-progress: true

jobs:
  verify-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production clone answers through real AI
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://herostar.up.railway.app';
          const visitorId = `github-ai-smoke-${Date.now()}`;

          async function request(path, options = {}) {
            const startedAt = performance.now();
            const response = await fetch(`${base}${path}`, {
              ...options,
              headers: {
                'content-type': 'application/json',
                'x-visitor-id': visitorId,
                ...(options.headers || {}),
              },
              signal: AbortSignal.timeout(120000),
            });
            const text = await response.text();
            let data = {};
            try { data = JSON.parse(text); } catch { data = { raw: text }; }
            return {
              response,
              data,
              latencyMs: Math.round(performance.now() - startedAt),
            };
          }

          const health = await request('/health');
          if (!health.response.ok || health.data?.ok !== true) {
            throw new Error(`health failed: ${health.response.status} ${JSON.stringify(health.data)}`);
          }
          console.log(`health: ${health.response.status}, latency_ms=${health.latencyMs}`);

          const created = await request('/api/charts', {
            method: 'POST',
            body: JSON.stringify({ demo: true, product: 'clone' }),
          });
          if (created.response.status !== 201 || !created.data?.id || !created.data?.accessToken) {
            throw new Error(`chart creation failed: ${created.response.status} ${JSON.stringify(created.data)}`);
          }
          console.log(`chart created: ${created.data.id}, latency_ms=${created.latencyMs}`);

          const consulted = await request('/api/consult', {
            method: 'POST',
            headers: { 'x-chart-token': created.data.accessToken },
            body: JSON.stringify({
              chartId: created.data.id,
              product: 'clone',
              question: 'Назови один конкретный практический шаг на сегодня. Ответь кратко.',
            }),
          });

          const answer = typeof consulted.data?.answer === 'string' ? consulted.data.answer.trim() : '';
          console.log(`AI consultation: HTTP ${consulted.response.status}, latency_ms=${consulted.latencyMs}, answer_chars=${answer.length}`);
          console.log(`AI answer preview: ${answer.slice(0, 240).replace(/\s+/g, ' ')}`);

          if (!consulted.response.ok) {
            throw new Error(`AI consultation failed: ${consulted.response.status} ${JSON.stringify(consulted.data)}`);
          }
          if (answer.length < 20) {
            throw new Error(`AI consultation returned missing/too-short answer: ${JSON.stringify(consulted.data)}`);
          }
          if (/Клон не смог ответить|CLONE_AI_UNAVAILABLE/i.test(answer)) {
            throw new Error(`AI error/fallback text returned: ${answer}`);
          }
          console.log('AI_SMOKE_OK=true');
          NODE
