name: HeroStar Production AI Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-ai-smoke.yml'

jobs:
  verify-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production clone answers through AI
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://herostar.up.railway.app';
          const visitorId = `github-ai-smoke-${Date.now()}`;

          async function request(path, options = {}) {
            const response = await fetch(`${base}${path}`, {
              ...options,
              headers: {
                'content-type': 'application/json',
                'x-visitor-id': visitorId,
                ...(options.headers || {}),
              },
              signal: AbortSignal.timeout(120000),
            });
            const text = await response.text();
            let data = {};
            try { data = JSON.parse(text); } catch { data = { raw: text }; }
            return { response, data };
          }

          const health = await request('/health');
          if (!health.response.ok) throw new Error(`health failed: ${health.response.status}`);
          console.log(`health: ${health.response.status}`);

          const created = await request('/api/charts', {
            method: 'POST',
            body: JSON.stringify({ demo: true, product: 'clone' }),
          });
          if (created.response.status !== 201 || !created.data.id || !created.data.accessToken) {
            console.error('chart creation response:', JSON.stringify(created.data));
            throw new Error(`chart creation failed: HTTP ${created.response.status}`);
          }
          console.log(`chart created: ${created.data.id}`);

          const consulted = await request('/api/consult', {
            method: 'POST',
            headers: { 'x-chart-token': created.data.accessToken },
            body: JSON.stringify({
              chartId: created.data.id,
              product: 'clone',
              question: 'Что мне сегодня лучше сделать в первую очередь?',
            }),
          });

          if (!consulted.response.ok) {
            console.error('consult response:', JSON.stringify(consulted.data));
            throw new Error(`AI consultation failed: HTTP ${consulted.response.status}`);
          }
          const answer = typeof consulted.data.answer === 'string' ? consulted.data.answer.trim() : '';
          if (!answer) {
            console.error('consult response:', JSON.stringify(consulted.data));
            throw new Error('AI consultation returned an empty answer');
          }
          console.log(`AI consultation: HTTP ${consulted.response.status}, answer chars=${answer.length}`);
          console.log(`AI answer preview: ${answer.slice(0, 180).replace(/\s+/g, ' ')}`);
          NODE