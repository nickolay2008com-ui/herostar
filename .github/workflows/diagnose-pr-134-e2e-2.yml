name: Diagnose PR 134 e2e second failure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-pr-134-e2e-2.yml

permissions:
  actions: read
  pull-requests: write
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Уточнить второе падение e2e PR 134'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: nickolay2008com-ui/herostar
    steps:
      - name: Extract failed browser-test log
        shell: bash
        run: |
          gh run view 30283615765 --job 90035840305 --log-failed > failed.log 2>&1 || true
          {
            echo '### Диагностика e2e после исправления селектора'
            echo
            echo '```text'
            tail -n 360 failed.log
            echo '```'
          } > comment.md
          gh pr comment 134 --body-file comment.md
