name: Apply clone answer restoration 11:45

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-restore-clone-1145.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Запустить восстановление ответа Клона 11:45'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/restore-clone-20260723-1145
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore the 11:45 answer data flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {found}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          old_compact = '''export function compactCloneEvidence(chart, factors = []) {
            return {
              version: chart?.version || null,
              birth: {
                unknownTime: Boolean(chart?.birth?.unknownTime),
                date: chart?.birth?.date || null,
              },
              system: chart?.system || null,
              selectedFactors: publicConsultationFactors(factors),
            };
          }
          '''
          new_compact = '''export function compactCloneEvidence(chart) {
            const unknownTime = Boolean(chart?.birth?.unknownTime);
            const planets = (chart?.planets || [])
              .filter((item) => !unknownTime || item.key !== 'moon')
              .map(({ key, name, sign, oppositeSign, element, mode, degreeLabel, house, houseArea, retrograde }) => ({
                key, name, sign, oppositeSign, element, mode, degreeLabel,
                house: unknownTime ? null : house,
                houseArea: unknownTime ? null : houseArea,
                retrograde,
              }));
            const aspects = (chart?.aspects || [])
              .filter((item) => !unknownTime || (item.from !== 'moon' && item.to !== 'moon'));

            return {
              version: chart?.version || null,
              person: chart?.person || null,
              birth: chart?.birth || null,
              system: chart?.system || null,
              houses: unknownTime ? null : chart?.houses || null,
              angles: unknownTime ? null : chart?.angles || null,
              planets,
              northNode: chart?.northNode || null,
              aspects,
              scope: 'full',
            };
          }
          '''
          replace_exact('src/consultation-factors.js', old_compact, new_compact)

          replace_exact(
              'src/ai.js',
              "          chart: product === 'clone' ? compactCloneEvidence(chart, factors) : compactChart(chart, profile),",
              "          chart: product === 'clone' ? compactCloneEvidence(chart) : compactChart(chart, profile),",
          )
          replace_exact(
              'src/ai.js',
              "          portrait: product === 'clone' ? null : portrait,",
              "          portrait,",
          )

          old_test_marker = "test('модель получает только тот набор факторов, который возвращается интерфейсу', () => {"
          test_file = Path('test/consultation-factors.test.js')
          test_text = test_file.read_text(encoding='utf-8')
          marker_index = test_text.find(old_test_marker)
          if marker_index < 0:
              raise SystemExit('test/consultation-factors.test.js: old model-evidence test not found')
          new_test = '''test('модель получает полную надёжную карту и сама выбирает релевантные факторы', () => {
            const evidence = compactCloneEvidence(chart());
            assert.equal(evidence.scope, 'full');
            assert.equal(evidence.planets.length, 10);
            assert.ok(evidence.houses);
            assert.ok(evidence.angles);
            assert.ok(evidence.northNode);
            assert.equal(evidence.aspects.length, 2);
            assert.equal('selectedFactors' in evidence, false);

            const withoutTime = compactCloneEvidence(chart({ unknownTime: true }));
            assert.equal(withoutTime.houses, null);
            assert.equal(withoutTime.angles, null);
            assert.ok(withoutTime.planets.every((item) => item.key !== 'moon'));
            assert.ok(withoutTime.aspects.every((item) => item.from !== 'moon' && item.to !== 'moon'));
          });
          '''
          test_file.write_text(test_text[:marker_index] + new_test, encoding='utf-8')

          replace_exact(
              'public/clone.js',
              "    : 'Задайте ситуацию. После ответа здесь появятся только те параметры карты, которые действительно были переданы модели для этого хода.';",
              "    : 'Задайте ситуацию. Клон получит полную карту и сам выберет 2–4 фактора, важные именно для ответа. Здесь появятся технические ориентиры по теме.';",
          )
          replace_exact(
              'public/clone.js',
              "    empty.textContent = scope?.note || 'Для этого ответа не удалось сформировать проверяемый след факторов.';",
              "    empty.textContent = scope?.note || 'Клон рассмотрел полную карту, но отдельные технические ориентиры для панели не сформированы.';",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Commit restored mechanism
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai.js src/consultation-factors.js public/clone.js test/consultation-factors.test.js
          git commit -m "Восстановить механику ответа Клона 2026-07-23 11:45"
          git push origin HEAD:codex/restore-clone-20260723-1145
