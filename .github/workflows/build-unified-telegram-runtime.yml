name: Build unified Telegram runtime

on:
  push:
    branches:
      - codex/unify-telegram-runtime-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap source
        uses: actions/checkout@v4
        with:
          ref: codex/unify-telegram-runtime-bootstrap
          path: source
          fetch-depth: 1
          show-progress: false

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Apply canonical Telegram runtime change
        working-directory: work
        shell: bash
        run: |
          set +e
          python ../source/scripts/apply-unified-telegram-runtime.py . > telegram-runtime-apply.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name "HeroStar Quality Bot"
            git config user.email "actions@users.noreply.github.com"
            git add -f telegram-runtime-apply.log
            git commit -m "Диагностика сборки Telegram runtime"
            git push --force origin HEAD:refs/heads/agent/unified-telegram-runtime-error
            cat telegram-runtime-apply.log
          fi
          exit "$status"

      - name: Install dependencies
        working-directory: work
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit and contract tests
        working-directory: work
        run: npm test

      - name: Syntax and diff validation
        working-directory: work
        shell: bash
        run: |
          node --check bootstrap.js
          node --check src/telegram-link-auth.js
          node --check src/practice-notifications.js
          node --check test/telegram-update-runtime.test.js
          git diff --check

      - name: Publish clean implementation branch
        working-directory: work
        shell: bash
        run: |
          rm -f telegram-runtime-apply.log
          git config user.name "HeroStar Quality Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bootstrap.js src/telegram-link-auth.js src/practice-notifications.js test/telegram-link-auth.test.js test/telegram-update-runtime.test.js
          git commit -m "Объединить Telegram-вход и практики в один runtime"
          git push --force origin HEAD:refs/heads/agent/unified-telegram-runtime
