name: Build unified Telegram runtime

on:
  push:
    branches:
      - codex/unify-telegram-runtime-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap source
        uses: actions/checkout@v4
        with:
          ref: codex/unify-telegram-runtime-bootstrap
          path: source
          fetch-depth: 1

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Apply canonical Telegram runtime change
        run: python source/scripts/apply-unified-telegram-runtime.py work

      - name: Install dependencies
        working-directory: work
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit and contract tests
        working-directory: work
        run: npm test

      - name: Syntax and diff validation
        working-directory: work
        shell: bash
        run: |
          node --check bootstrap.js
          node --check src/telegram-link-auth.js
          node --check src/practice-notifications.js
          node --check test/telegram-update-runtime.test.js
          git diff --check

      - name: Publish clean implementation branch
        working-directory: work
        shell: bash
        run: |
          git config user.name "HeroStar Quality Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bootstrap.js src/telegram-link-auth.js src/practice-notifications.js test/telegram-link-auth.test.js test/telegram-update-runtime.test.js
          git commit -m "Объединить Telegram-вход и практики в один runtime"
          git push --force origin HEAD:refs/heads/agent/unified-telegram-runtime
