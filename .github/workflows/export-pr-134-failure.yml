name: Export PR 134 failure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-pr-134-failure.yml

permissions:
  actions: read
  contents: write

jobs:
  export:
    if: github.event.head_commit.message == 'Экспортировать ошибку e2e PR 134'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: nickolay2008com-ui/herostar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/restore-clone-20260723-1145
          fetch-depth: 0
      - name: Export concise failure to branch
        shell: bash
        run: |
          gh run view 30283615765 --job 90035840305 --log-failed > full.log 2>&1 || true
          grep -E '([0-9]+\) \[|Test timeout|Error:|Call log:|waiting for locator|Expected|Received|at /home/runner)' full.log | head -n 220 > .e2e-pr-134-failure.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .e2e-pr-134-failure.txt
          git commit -m "Временно сохранить диагностику e2e PR 134"
          git push origin HEAD:codex/restore-clone-20260723-1145
