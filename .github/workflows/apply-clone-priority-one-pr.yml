name: Apply clone priority one from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-capture-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clone-priority-one
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply canonical implementation
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          workflow = Path('.github/workflows/apply-clone-priority-one.yml').read_text()
          match = re.search(r'PATCH_B64: "([A-Za-z0-9+/=]+)"', workflow)
          if not match:
              raise SystemExit('PATCH_B64 not found')
          Path('/tmp/apply-priority-one.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python /tmp/apply-priority-one.py
      - name: Capture unit test result
        shell: bash
        run: |
          set +e
          npm test > priority-one-test.log 2>&1
          status=$?
          echo "exit_status=$status" >> priority-one-test.log
          cat priority-one-test.log
          exit 0
      - name: Publish implementation for review
        shell: bash
        run: |
          rm -f .github/workflows/apply-clone-priority-one-pr.yml .github/workflows/apply-clone-priority-one.yml
          git config user.name "HeroStar Quality Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Применить первую очередь Клона для проверки [priority-one-applied]"
          git push origin HEAD:feature/clone-priority-one
