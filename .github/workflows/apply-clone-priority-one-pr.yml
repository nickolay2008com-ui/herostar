name: Build clone priority one artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clone-priority-one
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply canonical implementation
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          workflow = Path('.github/workflows/apply-clone-priority-one.yml').read_text()
          match = re.search(r'PATCH_B64: "([A-Za-z0-9+/=]+)"', workflow)
          if not match:
              raise SystemExit('PATCH_B64 not found')
          Path('/tmp/apply-priority-one.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python /tmp/apply-priority-one.py
      - name: Reconcile current contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {count}')
              target.write_text(text.replace(old, new, 1))

          replace('public/clone/index.html', '/clone.js?v=20260726-auth2', '/clone.js?v=20260726-priority1')
          replace(
              'src/ai.js',
              'return `Ваш звёздный клон сначала отделил бы необратимые ставки',
              'return `Ваш звёздный клон, вероятнее всего, сначала отделил бы необратимые ставки',
          )
          replace(
              'src/ai.js',
              "  if (premium) {\n    return String(profile?.systemPromptAddon || '').trim();\n  }",
              "  if (premium) {\n    return `${String(profile?.systemPromptAddon || '').trim()}\\n\\nСервер заранее выбрал факторы текущего ответа и передал их в selectedFactors. Используй только их; не добавляй ни одного положения, дома, угла или аспекта вне selectedFactors.`;\n  }",
          )
          replace(
              'test/clone-mobile-quality.test.js',
              "  assert.ok(assets.every((asset) => /[?&]v=20260726-auth2/.test(asset)));",
              "  assert.ok(assets.every((asset) => /[?&]v=[A-Za-z0-9._-]+/.test(asset)));\n  assert.match(html, /\\/clone\\.js\\?v=20260726-priority1/);",
          )
          replace(
              'test/consultation-profile.test.js',
              "  const answerCall = serverSource.slice(serverSource.indexOf('answerConsultation({'), serverSource.indexOf('answerConsultation({') + 500);",
              "  const answerCall = serverSource.slice(serverSource.indexOf('answerConsultationWithFactors({'), serverSource.indexOf('answerConsultationWithFactors({') + 500);",
          )
          PY
      - name: Capture unit tests
        shell: bash
        run: |
          set +e
          npm test > priority-one-test.log 2>&1
          status=$?
          echo "$status" > priority-one-unit-status
          tail -n 180 priority-one-test.log
          exit 0
      - name: Install Playwright Chromium
        shell: bash
        run: npx playwright install --with-deps chromium
      - name: Capture browser tests
        shell: bash
        run: |
          set +e
          npm run test:e2e > priority-one-e2e.log 2>&1
          status=$?
          echo "$status" > priority-one-e2e-status
          tail -n 220 priority-one-e2e.log
          exit 0
      - name: Capture syntax validation
        shell: bash
        run: |
          set +e
          {
            node --check server.js
            for file in public/*.js public/clone/live/*.js src/*.js; do node --check "$file"; done
            git diff --check
          } > priority-one-validation.log 2>&1
          status=$?
          echo "$status" > priority-one-validation-status
          cat priority-one-validation.log
          exit 0
      - name: Pack implementation
        if: always()
        shell: bash
        run: |
          tar -czf priority-one.tgz \
            src/consultation-factors.js src/ai.js server.js \
            public/clone.js public/clone.html public/clone/index.html public/clone/live/index.html public/clone/live/live.css \
            test/consultation-factors.test.js test/clone-answer-factors-contract.test.js \
            test/clone-mobile-quality.test.js test/consultation-profile.test.js \
            playwright.config.js e2e/clone-live.spec.js package.json package-lock.json \
            .github/workflows/ci.yml priority-one-test.log priority-one-e2e.log priority-one-validation.log \
            priority-one-unit-status priority-one-e2e-status priority-one-validation-status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clone-priority-one
          path: priority-one.tgz
          if-no-files-found: error
          retention-days: 2
      - name: Enforce green result
        if: always()
        shell: bash
        run: |
          test "$(cat priority-one-unit-status)" = "0"
          test "$(cat priority-one-e2e-status)" = "0"
          test "$(cat priority-one-validation-status)" = "0"
