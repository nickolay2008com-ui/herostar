name: Apply clone priority one from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-capture-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clone-priority-one
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Detect existing implementation
        id: state
        shell: bash
        run: |
          if [ -f src/consultation-factors.js ]; then echo "applied=true" >> "$GITHUB_OUTPUT"; else echo "applied=false" >> "$GITHUB_OUTPUT"; fi
      - name: Apply canonical implementation
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          workflow = Path('.github/workflows/apply-clone-priority-one.yml').read_text()
          match = re.search(r'PATCH_B64: "([A-Za-z0-9+/=]+)"', workflow)
          if not match:
              raise SystemExit('PATCH_B64 not found')
          Path('/tmp/apply-priority-one.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python /tmp/apply-priority-one.py
          git checkout HEAD -- .github/workflows/apply-clone-priority-one.yml .github/workflows/apply-clone-priority-one-pr.yml
      - name: Capture unit test result
        shell: bash
        run: |
          set +e
          npm test > priority-one-test.log 2>&1
          status=$?
          echo "exit_status=$status" >> priority-one-test.log
          tail -n 180 priority-one-test.log
          exit 0
      - name: Publish implementation for review
        shell: bash
        run: |
          git config user.name "HeroStar Quality Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Применить первую очередь Клона для проверки [priority-one-applied]"
          git push origin HEAD:feature/clone-priority-one
