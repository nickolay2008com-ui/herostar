name: Publish verified clone implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout bootstrap source
        uses: actions/checkout@v4
        with:
          ref: feature/clone-priority-one
          path: source
          fetch-depth: 0

      - name: Checkout clean main
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Restore implementation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/8634816222/zip > /tmp/priority-one.zip
          unzip -q /tmp/priority-one.zip -d /tmp/priority-one
          tar -xzf /tmp/priority-one/priority-one.tgz -C work

      - name: Apply approved contracts and final fix
        working-directory: work
        shell: bash
        run: |
          sed -i 's#/clone/live/live.css?v=20260726-auth2#/clone/live/live.css?v=20260726-priority1#' ../source/scripts/reconcile-clone-priority-one.py
          python ../source/scripts/reconcile-clone-priority-one.py
          python ../source/scripts/finalize-clone-priority-one.py

      - name: Install dependencies
        working-directory: work
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit and contract tests
        working-directory: work
        run: npm test

      - name: Install Playwright Chromium
        working-directory: work
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: work
        run: npm run test:e2e

      - name: Syntax and diff validation
        working-directory: work
        shell: bash
        run: |
          node --check server.js
          for file in public/*.js public/clone/live/*.js src/*.js; do node --check "$file"; done
          git diff --check

      - name: Publish clean implementation branch
        working-directory: work
        shell: bash
        run: |
          rm -rf priority-one-*.log priority-one-*-status test-results playwright-report
          git config user.name "HeroStar Quality Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Реализовать две очереди Звёздного клона"
          git push --force origin HEAD:refs/heads/agent/clone-priority-one-implementation
