name: Patch self-knowledge positioning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-self-knowledge-positioning.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update legal and live wording
        run: |
          python - <<'PY'
          from pathlib import Path

          legal = Path('src/legal.js')
          text = legal.read_text(encoding='utf-8')
          replacements = {
              "const EFFECTIVE_DATE = '24 июля 2026 года';": "const EFFECTIVE_DATE = '28 июля 2026 года';",
              "HeroStar предоставляет расчётную и текстовую интерпретацию натальной карты как инструмент саморефлексии и организации мыслей. Материалы не являются достоверным предсказанием будущего и не заменяют медицинскую, психологическую, юридическую, инвестиционную или иную профессиональную помощь.": "HeroStar — психологический инструмент самопознания и саморефлексии, использующий расчётную и текстовую интерпретацию натальной карты для организации мыслей и рассмотрения жизненных ситуаций. Сервис не является психологической услугой, психодиагностикой или лечением. Материалы не являются достоверным предсказанием будущего и не заменяют медицинскую, психологическую, юридическую, инвестиционную или иную профессиональную помощь.",
              "HeroStar является информационно-развлекательным и рефлексивным продуктом. Исполнитель не обещает наступления определённых жизненных событий и не гарантирует финансовый, психологический, медицинский или иной практический результат.": "HeroStar является психологическим инструментом самопознания и саморефлексии, а также информационно-развлекательным продуктом. Сервис не является психологической услугой, психодиагностикой или лечением. Исполнитель не обещает наступления определённых жизненных событий и не гарантирует финансовый, психологический, медицинский или иной практический результат.",
              "Инструмент саморефлексии, не медицинская, психологическая, юридическая или финансовая консультация.": "Психологический инструмент самопознания и саморефлексии, не медицинская, психологическая, юридическая или финансовая консультация."
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing legal text: {old[:80]}')
              text = text.replace(old, new, 1)
          legal.write_text(text, encoding='utf-8')

          live = Path('public/clone/live/index.html')
          text = live.read_text(encoding='utf-8')
          old = 'Клон не предсказывает будущее и не принимает решение за вас. Он создаёт ясную альтернативную позицию на основе параметров натальной карты.'
          new = 'HeroStar — психологический инструмент самопознания. Клон не предсказывает будущее, не оказывает психологические услуги и не принимает решение за вас. Он создаёт ясную альтернативную позицию на основе параметров натальной карты.'
          if old not in text:
              raise SystemExit('Missing live disclaimer')
          live.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/patch-self-knowledge-positioning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/legal.js public/clone/live/index.html .github/workflows/patch-self-knowledge-positioning.yml
          git commit -m "Закрепить HeroStar как психологический инструмент самопознания"
          git push
